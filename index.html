<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Cloud Certificate Provisioner</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            text-align: center;
            background-color: #0d0e12;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #161822;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            border: 1px solid #2a2d3d;
        }
        .input-group { text-align: left; margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #a0a5b5; }
        input {
            width: 100%; padding: 12px; box-sizing: border-box;
            background-color: #222533; border: 1px solid #3b3f54;
            border-radius: 8px; color: #ffffff; font-size: 15px;
        }
        input:focus { border-color: #007aff; outline: none; }
        button {
            width: 100%; padding: 14px; background-color: #007aff; color: #ffffff;
            font-size: 16px; font-weight: bold; border: none; border-radius: 8px;
            cursor: pointer; transition: background-color 0.2s; margin-top: 10px;
        }
        button:hover { background-color: #0056b3; }
        .status { display: none; margin-top: 15px; font-weight: bold; color: #ffcc00; }
        .error-box { display: none; background-color: #ff3b30; color: white; padding: 12px; border-radius: 8px; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Generate Apple Signing Certificate</h2>
        <p style="color: #8a8f9e; font-size: 14px; margin-bottom: 25px;">Your credentials will be handled directly by a remote GitHub Linux worker machine.</p>

        <div class="input-group">
            <label for="appleId">Apple ID Email</label>
            <input type="email" id="appleId" placeholder="name@example.com">
        </div>

        <div class="input-group">
            <label for="password">Password / App-Specific Password</label>
            <input type="password" id="password" placeholder="••••••••••••••••">
        </div>

        <div class="input-group">
            <label for="udid">Device UDID (Optional)</label>
            <input type="text" id="udid" placeholder="00008030-001D35DC0A8BC02E">
        </div>

        <button onclick="sendToGitHubActions()">Generate .p12 & Profile</button>

        <div id="loadingStatus" class="status">Waking up remote server pipeline...</div>
        <div id="errorDisplay" class="error-box"></div>
    </div>

    <script>
    // --- CONFIGURE YOUR REPOSITORY DETAILS HERE ---
    const GH_OWNER = "58mm958ycc-coder"; 
    const GH_REPO = "58mm958ycc-coder.github.io"; 
    // Paste your Personal Access Token here. (Keep repo private if you don't want others to steal it)
    const GH_PAT = "YOUR_GITHUB_PERSONAL_ACCESS_TOKEN"; 

    async function sendToGitHubActions() {
        const appleId = document.getElementById('appleId').value.trim();
        const password = document.getElementById('password').value.trim();
        const udid = document.getElementById('udid').value.trim();
        
        const loader = document.getElementById('loadingStatus');
        const errorBox = document.getElementById('errorDisplay');

        errorBox.style.display = "none";
        loader.style.display = "block";
        loader.innerText = "Triggering GitHub Actions cloud runner server...";

        if (!appleId || !password) {
            loader.style.display = "none";
            errorBox.innerText = "Error: Put correct Apple ID or password.";
            errorBox.style.display = "block";
            return;
        }

        try {
            // Sends the request to your GitHub actions workflow file
            const response = await fetch(`https://github.com\({GH_OWNER}/\){GH_REPO}/dispatches`, {
                method: 'POST',
                headers: {
                    'Authorization': `token \${GH_PAT}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    event_type: "generate_certs",
                    client_payload: {
                        apple_id: appleId,
                        apple_password: password,
                        device_udid: udid
                    }
                })
            });

            if (!response.ok) {
                throw new Error("Could not connect to GitHub API. Ensure your token/username configuration is correct.");
            }

            loader.innerText = "Server running! Logging into Apple & compiling files... (Takes about 40 seconds)";

            // Wait for GitHub to run the workflow script, then open the download tabs automatically
            setTimeout(() => {
                loader.innerText = "Done! Opening download links inside new browser tabs...";
                
                // Triggers automatic browser downloads directly out of your repository files
                window.open(`https://githubusercontent.com\({GH_OWNER}/\){GH_REPO}/main/output/developer_identity.p12`, '_blank');
                window.open(`https://githubusercontent.com\({GH_OWNER}/\){GH_REPO}/main/output/ios_profile.mobileprovision', '_blank');
            }, 40000);

        } catch (error) {
            loader.style.display = "none";
            errorBox.innerText = error.message;
            errorBox.style.display = "block";
        }
    }
    </script>

</body>
</html>
