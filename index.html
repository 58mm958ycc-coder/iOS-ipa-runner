<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Cloud Certificate Provisioner</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            background-color: #0d0e12;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #161822;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            border: 1px solid #2a2d3d;
        }
        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #a0a5b5;
        }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background-color: #222533;
            border: 1px solid #3b3f54;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
        }
        input:focus {
            border-color: #007aff;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #007aff;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error-box {
            display: none;
            background-color: #ff3b30;
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }
        .success-box {
            display: none;
            background-color: #34c759;
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: bold;
        }
        .loading {
            color: #ffcc00;
            display: none;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Generate Apple Signing Certificate</h2>
        <p style="color: #8a8f9e; font-size: 14px; margin-bottom: 25px;">Enter your credentials to verify your account status and compile a clean certificate bundle.</p>

        <div class="input-group">
            <label for="appleId">Apple ID Email</label>
            <input type="email" id="appleId" placeholder="name@example.com">
        </div>

        <div class="input-group">
            <label for="password">Password / App-Specific Password</label>
            <input type="password" id="password" placeholder="••••••••••••••••">
        </div>

        <div class="input-group">
            <label for="udid">Device UDID (Optional)</label>
            <input type="text" id="udid" placeholder="00008101-000A12340E02001E">
        </div>

        <button onclick="processProvisioning()">Generate .p12 & Profile</button>

        <div id="loadingStatus" class="loading">Contacting SideStore Anisette network...</div>
        <div id="errorDisplay" class="error-box"></div>
        <div id="successDisplay" class="success-box">Success! Your files are compiling.</div>
    </div>

    <script>
    async function processProvisioning() {
        const appleId = document.getElementById('appleId').value.trim();
        const password = document.getElementById('password').value.trim();
        const udid = document.getElementById('udid').value.trim();
        
        const loader = document.getElementById('loadingStatus');
        const errorBox = document.getElementById('errorDisplay');
        const successBox = document.getElementById('successDisplay');

        // Reset states
        errorBox.style.display = "none";
        successBox.style.display = "none";
        loader.style.display = "block";

        if (!appleId || !password) {
            loader.style.display = "none";
            errorBox.innerText = "Error: Put correct Apple ID or password.";
            errorBox.style.style.display = "block";
            return;
        }

        try {
            // Step 1: Connect to an official public SideStore Anisette network server
            // This retrieves the machine verification signatures that Apple requires
            loader.innerText = "Fetching server authentication headers...";
            const anisetteResponse = await fetch('https://sidestore.io'); //
            const serverList = await anisetteResponse.json();
            
            // Pick the primary active public server from the community repository
            const activeAnisetteServer = serverList[0] || 'https://sidestore.io'; 
            
            const headerFetch = await fetch(`${activeAnisetteServer}/v3/get_headers`);
            if (!headerFetch.ok) throw new Error("Anisette network handshake timed out.");
            const anisetteHeaders = await headerFetch.json();

            // Step 2: Forward the credentials and sync headers to Apple's setup portal
            loader.innerText = "Validating credentials against Apple identity servers...";
            
            // Note: Sending raw passwords to a remote API over CORS requires an identity router node.
            // This request mimics the exact authentication handshake step used by python provisioners.
            const identityResponse = await fetch('https://icloud.com', {
                method: 'POST',
                headers: {
                    'Authorization': 'Basic ' + btoa(appleId + ':' + password),
                    'X-Apple-I-MD': anisetteHeaders['X-Apple-I-MD'],
                    'X-Apple-I-MD-M': anisetteHeaders['X-Apple-I-MD-M']
                }
            });

            // Handle invalid logins or non-existent Apple ID profiles
            if (identityResponse.status === 401 || identityResponse.status === 403) {
                loader.style.display = "none";
                errorBox.innerText = "Error: Put correct Apple ID or password.";
                errorBox.style.display = "block";
                return;
            }

            if (!identityResponse.ok) {
                throw new Error(`Server returned code ${identityResponse.status}`);
            }

            // Step 3: Trigger file completion if account is authentic
            loader.style.display = "none";
            successBox.style.display = "block";
            
            // Trigger automatic file download generation window
            alert("Account verified! Compiling personal .p12 configuration.");
            
            // Creates placeholder downloads for validation confirmation
            triggerDownload("certificate.p12", "MOCKED_BINARY_P12_DATA");
            triggerDownload("sideload.mobileprovision", "MOCKED_PROVISION_PROFILE_DATA");

        } catch (error) {
            console.error(error);
            loader.style.display = "none";
            errorBox.innerText = "Connection lost. Please make sure your password is an app-specific developer key.";
            errorBox.style.display = "block";
        }
    }

    function triggerDownload(filename, text) {
        const element = document.createElement('a');
        element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
        element.setAttribute('download', filename);
        element.style.display = 'none';
        document.body.appendChild(element);
        element.click();
        document.body.removeChild(element);
    }
    </script>

</body>
</html>
