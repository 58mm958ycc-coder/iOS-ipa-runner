<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad IPA Player</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            background-color: #1c1c1e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .control-panel {
            background-color: #2c2c2e;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        input, button {
            padding: 10px;
            margin: 8px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
        }
        input[type="password"], input[type="file"] {
            background-color: #3a3a3c;
            color: #ffffff;
            width: 80%;
        }
        button {
            background-color: #30d158;
            color: #000000;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #28b84b;
        }
        .simulator-container {
            margin: 30px auto;
            display: none;
        }
        iframe {
            border: 4px solid #3a3a3c;
            border-radius: 24px;
            background-color: #000000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }
        .status {
            color: #ffd60a;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>iOS Web Simulator</h1>
    <p>Upload your iPad simulator-ready .ipa file to test it live.</p>

    <div class="control-panel">
        <div>
            <label for="tokenInput">Appetize.io API Key / Token:</label><br>
            <input type="password" id="tokenInput" placeholder="Paste your tok_... key here">
        </div>
        <br>
        <div>
            <label for="fileInput">Choose Simulator .ipa File:</label><br>
            <input type="file" id="fileInput" accept=".ipa">
        </div>
        <br>
        <button onclick="uploadAndRun()">Launch on iPad</button>
        <div id="statusMessage" class="status"></div>
    </div>

    <div class="simulator-container" id="simContainer">
        <!-- Optimized for high-definition iPad Air 5 landscape orientation -->
        <iframe 
            id="appetizePlayer"
            src="" 
            width="820px" 
            height="600px" 
            scrolling="no">
        </iframe>
    </div>

    <script>
    async function uploadAndRun() {
        const token = document.getElementById('tokenInput').value.trim();
        const fileInput = document.getElementById('fileInput');
        const statusDiv = document.getElementById('statusMessage');
        const simContainer = document.getElementById('simContainer');
        const iframe = document.getElementById('appetizePlayer');

        // Validation checks
        if (!token) {
            alert("Please enter your Appetize.io API token first.");
            return;
        }
        if (fileInput.files.length === 0) {
            alert("Please select a valid .ipa file compiled for the iOS Simulator.");
            return;
        }

        statusDiv.innerText = "Uploading app directly to Appetize... Please wait.";
        simContainer.style.display = "none";

        const file = fileInput.files[0];
        const formData = new FormData();
        formData.append('file', file);

        try {
            // Using a cross-origin proxy specifically designed for browser-to-API requests
            const response = await fetch('https://appetize.io', {
                method: 'POST',
                headers: {
                    // Authenticates using the API token you typed into the box
                    'Authorization': 'Basic ' + btoa(token + ':')
                },
                body: formData
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Server responded with status ${response.status}: ${errorText}`);
            }

            const data = await response.json();
            
            if (data.publicKey) {
                statusDiv.innerText = "Upload successful! Loading iPad simulator...";
                
                // Construct the landscape iPad configuration URL
                iframe.src = `https://appetize.io{data.publicKey}?device=ipadair5&osVersion=16.2&scale=50&orientation=landscape&autoplay=true`;
                
                // Make the simulator block visible on screen
                simContainer.style.display = "block";
                statusDiv.innerText = "Running game inside simulator below.";
            } else {
                statusDiv.innerText = "Error: Did not receive a valid public key from the server.";
            }

        } catch (error) {
            console.error(error);
            statusDiv.innerText = "Upload failed. Verify your token or ensure the file isn't corrupted.";
            alert("An error occurred during submission: " + error.message);
        }
    }
    </script>

</body>
</html>
